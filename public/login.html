<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Log in — AstraNote</title>
    <link rel="icon" href="/asset/logo.svg" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
    <script src="https://nexacaptcha.nxlabtw.com/captcha/gravity.js" defer></script>
  </head>
  <body data-page="login">
    <main class="page">
      <div class="shell form-layout">
        <section class="form-card reveal">
          <p class="eyebrow">
            <i class="fa-solid fa-key"></i><span data-i18n="loginEyebrow"></span>
          </p>
          <h1 data-auth-title data-i18n="signInTitle"></h1>
          <p class="muted" data-auth-body data-i18n="signInBody"></p>
          <form id="auth-form" novalidate>
            <div class="form-group">
              <label for="username" data-i18n="username"></label
              ><input
                id="username"
                name="username"
                autocomplete="username"
                maxlength="24"
                required
              />
            </div>
            <div class="form-group">
              <label for="password" data-i18n="password"></label
              ><input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                maxlength="256"
                required
              />
              <p class="field-help" data-i18n="noRecovery"></p>
            </div>
            <p class="captcha-heading"><i class="fa-solid fa-user-check"></i><span data-i18n="humanVerification"></span></p>
            <div class="captcha-box">
              <div
                class="nexa-captcha"
                data-captcha-type="gravity"
                data-callback="onCaptchaComplete"
              ></div>
            </div>
            <p class="form-message" role="alert"></p>
            <div class="form-actions">
              <a class="muted" href="/register"
                ><i class="fa-solid fa-user-plus"></i>
                <span data-i18n="register"></span
              ></a>
              <button class="btn btn-primary btn-lg" type="submit">
                <i class="fa-solid fa-arrow-right-to-bracket"></i
                ><span data-i18n="login"></span>
              </button>
            </div>
          </form>
        </section>
        <aside class="card reveal">
          <p class="eyebrow">
            <i class="fa-solid fa-lock"></i> PRIVATE BY DEFAULT
          </p>
          <h2 data-i18n="tagline"></h2>
          <p class="muted" data-i18n="englishOnlyCaptcha"></p>
        </aside>
      </div>
    </main>
  </body>
</html>
