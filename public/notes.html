<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>My notes — AstraNote</title>
    <link rel="icon" href="/asset/logo.svg" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
    <script
      src="https://nexacaptcha.nxlabtw.com/captcha/gravity.js"
      defer
    ></script>
  </head>
  <body data-page="notes">
    <a class="skip-link" href="#main" data-i18n="skipContent"></a>
    <main class="page" id="main">
      <div class="shell">
        <header class="page-head reveal">
          <div>
            <p class="eyebrow">
              <i class="fa-solid fa-box-archive"></i
              ><span data-i18n="notesEyebrow"></span>
            </p>
            <h1 data-i18n="allNotes"></h1>
            <p class="muted" data-i18n="allNotesBody"></p>
          </div>
          <a class="btn btn-primary btn-lg" href="/notes/new"
            ><i class="fa-solid fa-plus"></i><span data-i18n="createNote"></span
          ></a>
        </header>
        <div class="notes-toolbar reveal" id="notes-toolbar">
          <div
            class="note-search-row"
            role="search"
            data-i18n-aria-label="searchNotes"
          >
            <label class="note-search">
              <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
              <span class="sr-only" data-i18n="searchNotes"></span>
              <input
                id="note-search"
                type="search"
                maxlength="80"
                autocomplete="off"
                data-i18n-placeholder="searchNotesPlaceholder"
              />
            </label>
            <button
              class="btn note-filter-toggle"
              id="note-filter-toggle"
              type="button"
              aria-expanded="false"
              aria-controls="note-filters"
            >
              <i class="fa-solid fa-sliders" aria-hidden="true"></i
              ><span data-i18n="filters"></span>
              <span
                class="filter-dot"
                id="filter-dot"
                hidden
                aria-hidden="true"
              ></span>
            </button>
          </div>
          <div
            class="note-filters"
            id="note-filters"
            role="group"
            data-i18n-aria-label="filters"
            hidden
          >
            <button
              type="button"
              class="btn"
              data-note-filter="active"
              aria-pressed="true"
            >
              <i class="fa-solid fa-book-open" aria-hidden="true"></i
              ><span data-i18n="notes"></span>
            </button>
            <button
              type="button"
              class="btn"
              data-note-filter="pinned"
              aria-pressed="false"
            >
              <i class="fa-solid fa-thumbtack" aria-hidden="true"></i
              ><span data-i18n="pinned"></span>
            </button>
            <button
              type="button"
              class="btn"
              data-note-filter="archived"
              aria-pressed="false"
            >
              <i class="fa-solid fa-box-archive" aria-hidden="true"></i
              ><span data-i18n="archivedNotes"></span>
            </button>
          </div>
          <div class="notes-list-caption">
            <p
              class="field-help"
              id="notes-result-count"
              aria-live="polite"
              aria-atomic="true"
            ></p>
            <div class="batch-controls" id="batch-controls" hidden>
              <label class="selection-label"
                ><input type="checkbox" id="select-all" /><span
                  data-i18n="selectAll"
                ></span
              ></label>
              <span
                class="field-help"
                id="selected-count"
                aria-live="polite"
                hidden
              ></span>
              <div
                id="batch-actions"
                role="group"
                data-i18n-aria-label="batchAction"
                hidden
              >
                <button class="btn" type="button" id="batch-pin">
                  <i class="fa-solid fa-thumbtack" aria-hidden="true"></i
                  ><span></span>
                </button>
                <button class="btn" type="button" id="batch-archive">
                  <i class="fa-solid fa-box-archive" aria-hidden="true"></i
                  ><span></span>
                </button>
                <button class="btn btn-danger" type="button" id="batch-delete">
                  <i class="fa-solid fa-trash-can" aria-hidden="true"></i
                  ><span></span>
                </button>
              </div>
            </div>
          </div>
        </div>
        <p
          class="field-help"
          id="organization-upgrade"
          data-i18n="organizeUpgrade"
          hidden
        ></p>
        <section class="notes-panel reveal">
          <div class="note-list" id="note-list">
            <div class="empty-state" data-i18n="loading"></div>
          </div>
        </section>
      </div>
    </main>
    <div
      id="global-captcha"
      inert
      aria-hidden="true"
      class="nexa-captcha captcha-parking"
      data-captcha-type="gravity"
      data-callback="onActionCaptchaComplete"
    ></div>
  </body>
</html>
