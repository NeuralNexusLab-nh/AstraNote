<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="If AstraNote is useful to you, you can support its continued development with Bitcoin." />
    <link rel="canonical" href="https://astranote.nxlabtw.com/donate" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://astranote.nxlabtw.com/donate" />
    <meta property="og:title" content="Support AstraNote — Bitcoin donation" />
    <meta property="og:description" content="If AstraNote is useful to you, you can support its continued development with Bitcoin." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Support AstraNote — Bitcoin donation" />
    <meta name="twitter:description" content="If AstraNote is useful to you, you can support its continued development with Bitcoin." />
    <title>Support AstraNote — Bitcoin donation</title>
    <link rel="icon" href="/asset/logo.svg" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/vendor/qrcode-generator/qrcode.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body data-page="donate">
    <a class="skip-link" href="#main" data-i18n="skipContent"></a>
    <main id="main" class="page donate-page">
      <div class="shell">
        <section class="donate-layout" aria-labelledby="donate-title">
          <header class="donate-intro reveal">
            <p class="eyebrow"><i class="fa-solid fa-heart" aria-hidden="true"></i><span data-i18n="donatePageLabel"></span></p>
            <h1 id="donate-title" data-i18n="donateTitle"></h1>
            <p class="donate-description muted" data-i18n="donateDescription"></p>
            <div class="donate-network" data-i18n-aria-label="donateNetworkAria">
              <span class="pill donate-network-pill">BTC · MAINNET</span>
              <span class="muted" data-i18n="donateNetwork"></span>
            </div>
          </header>

          <section class="card donate-card reveal" aria-labelledby="bitcoin-title">
            <h2 id="bitcoin-title" class="donate-bitcoin-title">
              <span class="donate-bitcoin-symbol" aria-hidden="true">₿</span>
              <span data-i18n="donateBitcoinLabel"></span>
            </h2>
            <div class="donate-qr" id="donate-qr" role="img" data-i18n-aria-label="donateQrLabel">
              <canvas id="donate-qr-canvas" aria-hidden="true"></canvas>
              <span class="donate-qr-logo" aria-hidden="true">₿</span>
            </div>
            <div class="donate-address-group">
              <p class="donate-address-label" data-i18n="donateAddressLabel"></p>
              <div class="donate-address-row">
                <code class="donate-address" id="bitcoin-address">bc1qh3g3uhy90f93dqt00w5m0j2vh550r6t4dmqlqm</code>
                <button class="btn donate-copy" id="copy-bitcoin-address" type="button" data-i18n-aria-label="donateCopyLabel">
                  <i class="fa-regular fa-copy" aria-hidden="true"></i><span data-i18n="donateCopy"></span>
                </button>
              </div>
              <span class="donate-copy-feedback success-text" id="donate-copy-feedback" aria-live="polite" aria-atomic="true"></span>
            </div>
            <a class="btn btn-primary donate-wallet" href="bitcoin:bc1qh3g3uhy90f93dqt00w5m0j2vh550r6t4dmqlqm">
              <i class="fa-solid fa-wallet" aria-hidden="true"></i><span data-i18n="donateWallet"></span>
            </a>
          </section>
        </section>
      </div>
    </main>
  </body>
</html>
