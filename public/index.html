<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="AstraNote is a free online notebook for ideas, reminders, lists, and useful information."
    />
    <title>AstraNote — Notes ready when you need them</title>
    <link rel="icon" href="/asset/logo.svg" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body data-page="home">
    <a class="skip-link" href="#main">Skip to content</a>
    <main id="main">
      <section class="hero">
        <canvas
          class="space-canvas"
          id="space-canvas"
          aria-hidden="true"
        ></canvas>
        <div class="nebula" aria-hidden="true"></div>
        <div class="hero-content">
          <span class="hero-kicker"
            ><i class="fa-solid fa-note-sticky"></i
            ><span data-i18n="heroKicker"></span></span
          >
          <h1>AstraNote</h1>
          <p class="hero-tagline" data-i18n="tagline"></p>
          <p class="hero-description" data-i18n="heroLead"></p>
          <div class="hero-actions">
            <a class="btn btn-primary btn-lg" id="hero-primary" href="/register"
              ><i class="fa-solid fa-pen-nib"></i
              ><span data-i18n="begin"></span></a
            ><a class="btn btn-outline btn-lg" href="#purpose"
              ><i class="fa-solid fa-compass"></i
              ><span data-i18n="explore"></span
            ></a>
          </div>
        </div>
        <a class="scroll-cue" href="#stats"
          ><span data-i18n="scroll"></span><i class="fa-solid fa-arrow-down"></i
        ></a>
      </section>
      <section class="home-section" id="stats">
        <div class="shell stats-grid">
          <article class="stat-card reveal">
            <p class="eyebrow">
              <i class="fa-solid fa-signal"></i><span data-i18n="today"></span>
            </p>
            <strong id="online-stat">—</strong
            ><span class="muted" data-i18n="utc"></span>
          </article>
          <article class="stat-card reveal">
            <p class="eyebrow">
              <i class="fa-solid fa-users"></i
              ><span data-i18n="registered"></span>
            </p>
            <strong id="users-stat">—</strong
            ><span class="muted">AstraNote</span>
          </article>
        </div>
      </section>
      <section class="home-section" id="purpose">
        <div class="shell">
          <header class="section-head reveal">
            <p class="eyebrow">
              <i class="fa-solid fa-wand-magic-sparkles"></i
              ><span data-i18n="purposeEyebrow"></span>
            </p>
            <h2 data-i18n="purposeTitle"></h2>
          </header>
          <div class="product-intro reveal">
            <p data-i18n="purposeIntroOne"></p>
            <p data-i18n="purposeIntroTwo"></p>
            <p data-i18n="purposeIntroThree"></p>
          </div>
          <div class="feature-grid">
            <article class="card feature-card reveal">
              <h3 class="feature-heading">
                <span class="feature-icon"><i class="fa-solid fa-pen-nib"></i></span>
                <span data-i18n="quickTitle"></span>
              </h3>
              <p data-i18n="quickBody"></p>
            </article>
            <article class="card feature-card reveal">
              <h3 class="feature-heading">
                <span class="feature-icon"><i class="fa-solid fa-mobile-screen-button"></i></span>
                <span data-i18n="secureTitle"></span>
              </h3>
              <p data-i18n="secureBody"></p>
            </article>
            <article class="card feature-card reveal">
              <h3 class="feature-heading">
                <span class="feature-icon"><i class="fa-solid fa-gift"></i></span>
                <span data-i18n="shareTitle"></span>
              </h3>
              <p data-i18n="shareBody"></p>
            </article>
          </div>
        </div>
      </section>
      <section class="home-section">
        <div class="shell limit-panel">
          <div class="reveal">
            <p class="eyebrow">
              <i class="fa-solid fa-gauge-high"></i
              ><span data-i18n="limitEyebrow"></span>
            </p>
            <h2 data-i18n="limitTitle"></h2>
            <p class="muted" data-i18n="limitBody"></p>
          </div>
          <div class="limit-visual reveal">
            <span class="muted"
              ><i class="fa-solid fa-hard-drive"></i><span data-i18n="accountStorageLabel"></span></span
            ><strong>256 KiB</strong>
            <div class="meter"><span class="demo-progress"></span></div>
            <p class="muted limit-caption">
              <i class="fa-solid fa-note-sticky"></i><span data-i18n="accountLimitCaption"></span>
            </p>
          </div>
        </div>
      </section>
      <section class="home-section encryption-section" id="encryption">
        <div class="shell">
          <header class="section-head encryption-section-head reveal">
            <p class="eyebrow">
              <i class="fa-solid fa-shield-halved" aria-hidden="true"></i
              ><span data-i18n="encryptionEyebrow"></span>
            </p>
            <h2 data-i18n="encryptionTitle"></h2>
            <p class="muted encryption-lead" data-i18n="encryptionIntro"></p>
          </header>
          <aside class="title-visibility-note reveal">
            <i class="fa-solid fa-eye" aria-hidden="true"></i>
            <div>
              <strong data-i18n="encryptionTitleNoticeTitle"></strong>
              <p data-i18n="encryptionTitleNoticeBody"></p>
            </div>
          </aside>
          <div class="encryption-table-wrap reveal">
            <table class="encryption-table" data-i18n-aria-label="encryptionTableLabel">
              <thead>
                <tr>
                  <th scope="col" data-i18n="encryptionModeColumn"></th>
                  <th scope="col" data-i18n="encryptionMethodColumn"></th>
                  <th scope="col" data-i18n="encryptionExposureColumn"></th>
                  <th scope="col" data-i18n="encryptionSecurityColumn"></th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <th scope="row" data-label-key="encryptionModeColumn"><span class="encryption-mode-icon plain" aria-hidden="true"><i class="fa-solid fa-file-lines"></i></span><span data-i18n="encryptionNoneName"></span></th>
                  <td data-label-key="encryptionMethodColumn" data-i18n="encryptionNoneMethod"></td>
                  <td data-label-key="encryptionExposureColumn" data-i18n="encryptionNoneExposure"></td>
                  <td data-label-key="encryptionSecurityColumn"><span class="security-level security-none"><i class="fa-solid fa-lock-open" aria-hidden="true"></i><span data-i18n="encryptionNoneSecurity"></span></span></td>
                </tr>
                <tr>
                  <th scope="row" data-label-key="encryptionModeColumn"><span class="encryption-mode-icon" aria-hidden="true"><i class="fa-solid fa-lock"></i></span><span>AES-128-GCM</span></th>
                  <td data-label-key="encryptionMethodColumn" data-i18n="encryptionAes128Method"></td>
                  <td data-label-key="encryptionExposureColumn" data-i18n="encryptionAesExposure"></td>
                  <td data-label-key="encryptionSecurityColumn"><span class="security-level"><i class="fa-solid fa-shield" aria-hidden="true"></i><span data-i18n="encryptionAes128Security"></span></span></td>
                </tr>
                <tr>
                  <th scope="row" data-label-key="encryptionModeColumn"><span class="encryption-mode-icon" aria-hidden="true"><i class="fa-solid fa-lock"></i></span><span>AES-256-GCM</span></th>
                  <td data-label-key="encryptionMethodColumn" data-i18n="encryptionAes256Method"></td>
                  <td data-label-key="encryptionExposureColumn" data-i18n="encryptionAesExposure"></td>
                  <td data-label-key="encryptionSecurityColumn"><span class="security-level"><i class="fa-solid fa-shield-halved" aria-hidden="true"></i><span data-i18n="encryptionAes256Security"></span></span></td>
                </tr>
                <tr class="schybrid-row">
                  <th scope="row" data-label-key="encryptionModeColumn"><span class="encryption-mode-icon confidential" aria-hidden="true"><i class="fa-solid fa-user-shield"></i></span><span>AstraConfidential SCHybrid</span></th>
                  <td data-label-key="encryptionMethodColumn" data-i18n="encryptionSchybridMethod"></td>
                  <td data-label-key="encryptionExposureColumn" data-i18n="encryptionSchybridExposure"></td>
                  <td data-label-key="encryptionSecurityColumn"><span class="security-level security-layered"><i class="fa-solid fa-layer-group" aria-hidden="true"></i><span data-i18n="encryptionSchybridSecurity"></span></span></td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="schybrid-explainer reveal">
            <div class="schybrid-explainer-icon" aria-hidden="true"><i class="fa-solid fa-fingerprint"></i></div>
            <div>
              <h3 data-i18n="encryptionSchybridTitle"></h3>
              <p data-i18n="encryptionSchybridBody"></p>
              <p class="muted" data-i18n="encryptionSchybridCaution"></p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
