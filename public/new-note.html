<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>New note — AstraNote</title>
    <link rel="icon" href="/asset/logo.svg" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/vendor/hash-wasm/argon2.umd.min.js" defer></script>
    <script src="/app.js" defer></script>
    <script src="https://nexacaptcha.nxlabtw.com/captcha/gravity.js" defer></script>
  </head>
  <body data-page="new-note">
    <main class="page">
      <div class="shell form-layout form-layout-single">
        <section class="form-card reveal">
          <p class="eyebrow">
            <i class="fa-solid fa-note-sticky"></i><span data-i18n="newNoteEyebrow"></span>
          </p>
          <h1 data-i18n="newNote"></h1>
          <p class="muted" data-i18n="newNoteBody"></p>
          <form id="note-form" autocomplete="off">
            <div class="form-group">
              <label for="name" data-i18n="noteName"></label
              ><input id="name" name="name" maxlength="80" required />
            </div>
            <div class="form-group">
              <label for="encryption" data-i18n="encryption"></label
              ><select id="encryption" name="encryption">
                <option value="none" data-i18n="noEncryptionOption"></option>
                <option value="aes-256-gcm">AES-256-GCM</option>
                <option value="aes-128-gcm">AES-128-GCM</option>
                <option value="astra-confidential-schybrid-v1">
                  AstraConfidential SCHybrid
                </option>
              </select>
              <p class="field-help" data-i18n="encryptionHelp"></p>
            </div>
            <div class="vault-fields" id="vault-fields" hidden>
              <div class="form-group">
                <label for="vault-pin" data-i18n="vaultPin"></label
                ><input
                  id="vault-pin"
                  name="vaultPin"
                  type="text"
                  class="vault-pin-input"
                  inputmode="numeric"
                  pattern="[0-9]{4,6}"
                  minlength="4"
                  maxlength="6"
                  autocomplete="off"
                  readonly
                  data-1p-ignore="true"
                  data-lpignore="true"
                  data-bwignore="true"
                  data-form-type="other"
                />
              </div>
              <div class="form-group">
                <label for="vault-pin-confirm" data-i18n="confirmVaultPin"></label
                ><input
                  id="vault-pin-confirm"
                  name="vaultPinConfirmation"
                  type="text"
                  class="vault-pin-input"
                  inputmode="numeric"
                  pattern="[0-9]{4,6}"
                  minlength="4"
                  maxlength="6"
                  autocomplete="off"
                  readonly
                  data-1p-ignore="true"
                  data-lpignore="true"
                  data-bwignore="true"
                  data-form-type="other"
                />
              </div>
              <div class="vault-explanation">
                <h3><i class="fa-solid fa-user-shield"></i><span data-i18n="vaultTitle"></span></h3>
                <p data-i18n="vaultExplanation"></p>
                <p data-i18n="vaultPinWarning"></p>
                <p><i class="fa-solid fa-share-nodes"></i><span data-i18n="vaultNoSharing"></span></p>
              </div>
            </div>
            <p class="captcha-heading"><i class="fa-solid fa-user-check"></i><span data-i18n="humanVerification"></span></p>
            <div class="captcha-box">
              <div
                class="nexa-captcha"
                data-captcha-type="gravity"
                data-callback="onCaptchaComplete"
              ></div>
            </div>
            <p class="form-message" role="alert"></p>
            <div class="form-actions">
              <a class="btn" href="/notes"
                ><i class="fa-solid fa-xmark"></i
                ><span data-i18n="cancel"></span
              ></a>
              <button class="btn btn-primary btn-lg" type="submit">
                <i class="fa-solid fa-plus"></i><span data-i18n="create"></span>
              </button>
            </div>
          </form>
        </section>
      </div>
    </main>
  </body>
</html>
