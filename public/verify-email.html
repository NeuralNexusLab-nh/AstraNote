<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>AstraNote - Verify Email</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js" defer></script>
  </head>
  <body data-page="verify-email">
    <main class="page verification-page">
      <div class="shell">
        <section class="verification-card reveal" id="verification-pending">
          <p class="eyebrow"><i class="fa-solid fa-envelope-circle-check" aria-hidden="true"></i> ASTRANOTE</p>
          <h1 data-i18n="verifyEmailTitle"></h1>
          <p class="muted" data-i18n="verifyEmailBody"></p>
          <p class="form-message" role="status"></p>
        </section>
        <section class="verification-card verification-card-success reveal" id="verification-success" hidden aria-live="polite">
          <span class="verification-success-icon"><i class="fa-solid fa-circle-check" aria-hidden="true"></i></span>
          <p class="eyebrow">ASTRANOTE</p>
          <h1 data-i18n="verifiedTitle"></h1>
          <p class="muted" data-i18n="verifiedBody"></p>
        </section>
      </div>
    </main>
  </body>
</html>
