<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Dashboard — AstraNote</title>
    <link rel="icon" href="/asset/logo.svg" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body data-page="dashboard">
    <main class="page">
      <div class="shell">
        <header class="page-head reveal">
          <div>
            <p class="eyebrow">
              <i class="fa-solid fa-chart-line"></i><span data-i18n="dashboardEyebrow"></span>
            </p>
            <h1 data-i18n="welcome"></h1>
            <p class="muted" data-i18n="welcomeBody"></p>
          </div>
          <a class="btn btn-primary btn-lg" href="/notes/new"
            ><i class="fa-solid fa-plus"></i><span data-i18n="createNote"></span
          ></a>
        </header>
        <section class="summary-grid">
          <article class="card summary-card reveal">
            <div class="summary-label"><i class="fa-solid fa-book"></i><span data-i18n="notebooks"></span></div>
            <div class="summary-value"><strong id="note-count">—</strong></div>
            <small class="muted" id="note-limit-caption"></small>
          </article>
          <article class="card summary-card reveal">
            <div class="summary-label"><i class="fa-solid fa-hard-drive"></i><span data-i18n="storage"></span></div>
            <div class="summary-value"><strong id="storage-count">—</strong></div>
            <div class="meter"><span></span></div>
          </article>
          <article class="card summary-card reveal">
            <div class="summary-label"><i class="fa-solid fa-hourglass-half"></i><span data-i18n="accountAge"></span></div>
            <div class="summary-value"><strong id="age-count">—</strong><span class="summary-unit" data-i18n="days"></span></div>
            <small class="muted">UTC</small>
          </article>
        </section>
        <section class="card account-plan-card reveal">
          <div class="account-plan-main">
            <span class="feature-icon"><i class="fa-solid fa-layer-group" aria-hidden="true"></i></span>
            <div><small class="muted" data-i18n="currentPlan"></small><h2 id="dashboard-plan">—</h2></div>
          </div>
          <div class="plan-days-grid">
            <div><span>Pro</span><strong id="dashboard-pro-days">—</strong></div>
            <div><span>Plus</span><strong id="dashboard-plus-days">—</strong></div>
          </div>
          <a class="btn btn-primary" href="/plans"><i class="fa-solid fa-rotate" aria-hidden="true"></i><span data-i18n="renewPlan"></span></a>
        </section>
        <section class="locked-warning reveal" id="dashboard-locked-warning" hidden></section>
        <section class="notes-panel reveal">
          <header class="panel-head">
            <h3 data-i18n="recent"></h3>
            <a class="btn" href="/notes"
              ><i class="fa-solid fa-arrow-right"></i
              ><span data-i18n="viewAll"></span
            ></a>
          </header>
          <div class="note-list" id="note-list">
            <div class="empty-state" data-i18n="loading"></div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
